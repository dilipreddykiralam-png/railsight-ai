name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run software checks (no model download required)
        run: python -m pytest -q --junitxml=test-results.xml
  hosted-ui:
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt gradio==5.49.1
      - run: python scripts/build_hf_space.py
      - name: Check hosted UI with fixture inference (no GPU)
        run: python scripts/check_hf_ui.py
